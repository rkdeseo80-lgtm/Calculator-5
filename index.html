<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>5行電卓</title>
<meta name="apple-mobile-web-app-title" content="5行電卓">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#148252">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#148252}
button,input{font:inherit}.app{height:100dvh;padding:5px;display:grid;grid-template-rows:29px 1fr;gap:4px}
.top,.main{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:5px}.names,.cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}
.names input{width:100%;height:29px;border:1px solid #555;border-radius:5px;text-align:center;font-weight:700;font-size:12px}.main{min-height:0}.cols{min-height:0}
.col{background:#fff;border:2px solid #0c633d;border-radius:6px;display:flex;flex-direction:column;min-width:0;overflow:hidden}.col.active{border-color:#ffd43b;border-width:3px}
.paper{flex:1;min-height:0;overflow:auto;background:repeating-linear-gradient(#fff 0,#fff 31px,#ddd 32px)}
.cell{height:32px;position:relative;padding:6px 27px 0 18px;text-align:right;font-size:13px;cursor:pointer}.cell.selected{background:#ffe681}.cell.minus{color:#d00000;font-weight:800}
.op{position:absolute;left:4px}.del{position:absolute;right:2px;top:3px;width:23px;height:25px;border:0;border-radius:4px;color:#c00;background:#eee;font-weight:800}
.summary{border-top:1px solid #bbb;padding:3px;font-size:9px}.row{display:flex;justify-content:space-between;align-items:center;margin:1px 0}.row strong{font-size:12px}
.point{display:block;width:100%;height:30px;border:2px solid #777;border-radius:5px;background:#fff;color:#111;text-align:right;font-size:15px;padding:0 5px;margin:2px 0;-webkit-appearance:none;appearance:none}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:2px}.tools button{height:25px;border:1px solid #555;border-radius:4px;font-size:10px;font-weight:700}.ac{color:#b00}.copy{color:#245aa5}
.calc{display:grid;grid-template-rows:52px 44px 1fr;gap:4px;min-height:0}.display{background:#fff;border:2px solid #333;border-radius:6px;padding:2px 7px;text-align:right}.expr{height:15px;font-size:10px;color:#555;white-space:nowrap;overflow:hidden}.screen{font-size:24px;font-weight:800;line-height:30px}
.numberInput{width:100%;height:44px;border:3px solid #ffd43b;border-radius:7px;background:#fff;color:#111;font-size:20px;font-weight:800;text-align:right;padding:0 9px;-webkit-appearance:none;appearance:none}
.numberInput::placeholder{font-size:13px;font-weight:600;color:#777}.keys{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.key{border:2px solid #333;border-radius:7px;background:linear-gradient(#fff,#ddd);font-size:24px;font-weight:800;min-height:42px}.opkey{background:#f7ebbd;color:#1687df;font-size:29px}.eq{background:#ffd45c}.danger{color:#b00}
.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:center;justify-content:center}.overlay.show{display:flex}.dialog{width:min(420px,90vw);background:#fff;border-radius:12px;padding:14px}.dest{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:10px 0}.dest button,.cancel{height:40px}
@media (orientation:landscape) and (min-width:1000px){.top,.main{grid-template-columns:minmax(0,1fr) 300px}.cell{height:34px}.paper{background:repeating-linear-gradient(#fff 0,#fff 33px,#ddd 34px)}}
</style>
</head>
<body>
<div class="app">
 <div class="top"><div class="names" id="names"></div><div></div></div>
 <div class="main">
  <div class="cols" id="cols"></div>
  <div class="calc">
   <div class="display"><div class="expr" id="expr">マス選択 → 四則演算 → 数字入力</div><div class="screen" id="screen">0</div></div>
   <input id="numInput" class="numberInput" type="text" inputmode="decimal" pattern="[0-9.]*" placeholder="ここをタップして数字入力" autocomplete="off">
   <div class="keys" id="keys"></div>
  </div>
 </div>
</div>
<div class="overlay" id="overlay"><div class="dialog"><b id="copyTitle">コピー先</b><div class="dest" id="dest"></div><button class="cancel" id="cancel">キャンセル</button></div></div>
<script>
(function(){
"use strict";
const N=5, ROWS=8, STORE="five_calc_ios_v2";
let data=Array.from({length:N},()=>[]), names=Array.from({length:N},(_,i)=>"List"+(i+1)), points=Array(N).fill(0);
let active=0,target=0,pending=null,copySource=null;
const $=id=>document.getElementById(id), fmt=n=>Number(n).toLocaleString("ja-JP",{maximumFractionDigits:2});
function total(i){return data[i].reduce((s,x)=>s+Number(x.effect||0),0)}
function save(){try{localStorage.setItem(STORE,JSON.stringify({data,names,points}))}catch(e){}}
function load(){try{let s=JSON.parse(localStorage.getItem(STORE)||"null");if(!s)return;if(Array.isArray(s.data)&&s.data.length===N)data=s.data;if(Array.isArray(s.names)&&s.names.length===N)names=s.names;if(Array.isArray(s.points)&&s.points.length===N)points=s.points}catch(e){}}
function effect(v,op,i){if(op==="+")return v;if(op==="-")return-v;let b=total(i);if(op==="×")return b*v-b;if(op==="÷")return v===0?NaN:b/v-b;return v}
function namesRender(){let r=$("names");r.innerHTML="";names.forEach((n,i)=>{let x=document.createElement("input");x.value=n;x.dataset.name=i;r.appendChild(x)})}
function render(){
 let root=$("cols");root.innerHTML="";
 for(let i=0;i<N;i++){
  let col=document.createElement("div");col.className="col"+(i===active?" active":"");col.dataset.col=i;
  let paper=document.createElement("div");paper.className="paper";
  let count=Math.max(ROWS,data[i].length+1);
  for(let r=0;r<count;r++){
   let c=document.createElement("div");c.className="cell"+(i===active&&r===target?" selected":"");c.dataset.col=i;c.dataset.row=r;
   if(r<data[i].length){let x=data[i][r];if(x.op==="-"||Number(x.effect)<0)c.classList.add("minus");c.innerHTML='<span class="op">'+x.op+'</span>'+fmt(x.value)+'<button class="del" data-del="'+i+':'+r+'">×</button>'}
   paper.appendChild(c)
  }
  col.appendChild(paper);
  let s=document.createElement("div");s.className="summary";
  s.innerHTML='<div class="row"><span>支払い合計</span><strong>'+fmt(total(i))+'円</strong></div><label>付与ポイント</label><input class="point" data-point="'+i+'" type="text" inputmode="numeric" pattern="[0-9]*" value="'+(points[i]||"")+'" placeholder="0"><div class="row"><span>実質金額</span><strong>'+fmt(total(i)-(points[i]||0))+'円</strong></div>';
  col.appendChild(s);
  let t=document.createElement("div");t.className="tools";t.innerHTML='<button class="ac" data-ac="'+i+'">AC</button><button class="copy" data-copy="'+i+'">列コピー</button>';col.appendChild(t);root.appendChild(col)
 }
}
function screen(){let v=$("numInput").value||"0";$("screen").textContent=(pending?pending+" ":"")+v}
function selectCell(i,r){active=i;target=r;render();$("expr").textContent=names[i]+" "+(r+1)+"行目 → 四則演算を選択"}
function selectOp(op){pending=op;$("numInput").value="";screen();$("expr").textContent=names[active]+" "+(target+1)+"行目："+op+" → 白い数字入力欄をタップ"}
function commit(){
 if(!pending){$("expr").textContent="先に ＋ − × ÷ を選択";return}
 let raw=$("numInput").value.replace(/,/g,"");if(raw===""){ $("expr").textContent="数字を入力してください";return}
 let v=Number(raw);if(!Number.isFinite(v))return;let ef=effect(v,pending,active);if(!Number.isFinite(ef)){$("expr").textContent="0では割れません";return}
 let pos=Math.min(target,data[active].length);data[active].splice(pos,0,{value:v,op:pending,effect:ef});target=pos+1;$("numInput").value="";save();render();screen();$("expr").textContent=names[active]+" "+(pos+1)+"行目に入力完了"
}
function buildKeys(){[["÷","op"],["×","op"],["-","op"],["+","op"],["←","back"],["C","clear"],["=","eq"],["AC","all"]].forEach(([v,t])=>{let b=document.createElement("button");b.className="key "+(t==="op"?"opkey ":"")+(t==="eq"?"eq ":"")+(t==="all"||t==="clear"?"danger ":"");b.textContent=v;b.dataset.t=t;b.dataset.v=v;$("keys").appendChild(b)})}
$("numInput").addEventListener("input",function(){let v=this.value.replace(/,/g,"").replace(/[^0-9.]/g,"");let p=v.indexOf(".");if(p>=0)v=v.slice(0,p+1)+v.slice(p+1).replace(/\./g,"");this.value=v;screen()});
$("numInput").addEventListener("focus",function(){if(!pending)$("expr").textContent="先に ＋ − × ÷ を選択してください"});
$("keys").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;let t=b.dataset.t;if(t==="op")selectOp(b.dataset.v);else if(t==="eq")commit();else if(t==="clear"){$("numInput").value="";pending=null;screen()}else if(t==="back"){$("numInput").value=$("numInput").value.slice(0,-1);screen()}else if(t==="all"){data[active]=[];points[active]=0;target=0;pending=null;$("numInput").value="";save();render();screen()}});
$("cols").addEventListener("click",e=>{
 if(e.target.dataset.del){let [i,r]=e.target.dataset.del.split(":").map(Number);data[i].splice(r,1);active=i;target=Math.min(r,data[i].length);save();render();return}
 if(e.target.dataset.ac!==undefined){let i=Number(e.target.dataset.ac);data[i]=[];points[i]=0;active=i;target=0;save();render();return}
 if(e.target.dataset.copy!==undefined){copySource=Number(e.target.dataset.copy);openCopy();return}
 let c=e.target.closest(".cell");if(c)selectCell(Number(c.dataset.col),Number(c.dataset.row))
});
/* IMPORTANT: do not render while a point input is being typed. This preserves iPad keyboard focus. */
$("cols").addEventListener("focusin",e=>{if(e.target.dataset.point!==undefined){active=Number(e.target.dataset.point)}});
$("cols").addEventListener("input",e=>{
 if(e.target.dataset.point===undefined)return;
 let i=Number(e.target.dataset.point),v=e.target.value.replace(/\D/g,"");e.target.value=v;points[i]=Number(v)||0;save();
 let col=e.target.closest(".col"),strongs=col.querySelectorAll(".row strong");if(strongs.length>1)strongs[1].textContent=fmt(total(i)-points[i])+"円"
});
$("names").addEventListener("input",e=>{let i=Number(e.target.dataset.name);names[i]=e.target.value||("List"+(i+1));save()});
function openCopy(){let d=$("dest");d.innerHTML="";$("copyTitle").textContent=names[copySource]+" のコピー先";for(let i=0;i<N;i++)if(i!==copySource){let b=document.createElement("button");b.textContent=names[i];b.dataset.dest=i;d.appendChild(b)}$("overlay").classList.add("show")}
$("dest").addEventListener("click",e=>{if(e.target.dataset.dest===undefined)return;let d=Number(e.target.dataset.dest);data[d]=data[copySource].map(x=>({...x}));points[d]=points[copySource];active=d;target=data[d].length;save();render();$("overlay").classList.remove("show")});
$("cancel").onclick=()=>$("overlay").classList.remove("show");
load();namesRender();buildKeys();render();screen();
})();
</script>
</body></html>
