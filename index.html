<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>5行電卓</title>
<meta name="apple-mobile-web-app-title" content="5行電卓">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#148252">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#148252}
button,input{font:inherit}.app{height:100dvh;padding:4px;display:grid;grid-template-rows:28px 1fr;gap:3px}
.top,.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:4px}.names,.cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}
.names input{width:100%;height:28px;border:1px solid #555;border-radius:5px;text-align:center;font-weight:700;font-size:12px}
.main,.cols{min-height:0}.col{background:#fff;border:2px solid #0c633d;border-radius:6px;display:flex;flex-direction:column;min-width:0;overflow:hidden}.col.active{border:3px solid #ffd43b}
.paper{flex:1;min-height:0;overflow:auto;background:repeating-linear-gradient(#fff 0,#fff 31px,#ddd 32px)}
.cell{height:32px;position:relative;padding:6px 27px 0 18px;text-align:right;font-size:13px;cursor:pointer}.cell.selected{background:#ffe681}.cell.minus{color:#d00000;font-weight:800}
.op{position:absolute;left:4px}.del{position:absolute;right:2px;top:3px;width:23px;height:25px;border:0;border-radius:4px;color:#c00;background:#eee;font-weight:800}
.summary{border-top:2px solid #999;padding:4px;font-size:10px}.row{display:flex;justify-content:space-between;align-items:center;margin:2px 0}.row strong{font-size:17px;line-height:22px}.row.pay strong{font-size:19px}.row.real{background:#fff3b8;border-radius:4px;padding:3px 2px}.row.real strong{font-size:20px;font-weight:900}
.point{display:block;width:100%;height:29px;border:2px solid #777;border-radius:5px;background:#fff;color:#111;text-align:right;font-size:16px;padding:0 5px;margin:2px 0;-webkit-appearance:none;appearance:none}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:2px}.tools button{height:25px;border:1px solid #555;border-radius:4px;font-size:10px;font-weight:700}.acsmall{color:#b00}.copy{color:#245aa5}
.calc{display:grid;grid-template-rows:51px 1fr;gap:3px;min-height:0}.display{background:#fff;border:2px solid #333;border-radius:6px;padding:2px 7px;text-align:right}.expr{height:15px;font-size:10px;color:#555;white-space:nowrap;overflow:hidden}.screen{font-size:24px;font-weight:800;line-height:30px}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:4px;min-height:0;height:100%}.key{border:2px solid #333;border-radius:7px;background:linear-gradient(#fff,#ddd);font-size:27px;font-weight:800;min-width:0;min-height:44px;color:#1687df;touch-action:manipulation;-webkit-user-select:none;user-select:none}.opkey{background:#f7ebbd}.opkey.chosen{background:#ffd45c}.key.locked{opacity:.38}.eq{background:#ffd45c}.danger{color:#c00}
.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:center;justify-content:center}.overlay.show{display:flex}.dialog{width:min(420px,90vw);background:#fff;border-radius:12px;padding:14px}.dest{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:10px 0}.dest button,.cancel{height:40px}
@media (orientation:landscape) and (min-width:1000px){.top,.main{grid-template-columns:minmax(0,1fr) 310px}.cell{height:33px}.paper{background:repeating-linear-gradient(#fff 0,#fff 32px,#ddd 33px)}}
</style>
</head>
<body>
<div class="app">
 <div class="top"><div class="names" id="names"></div><div></div></div>
 <div class="main">
  <div class="cols" id="cols"></div>
  <div class="calc">
   <div class="display"><div class="expr" id="expr">＋は数字だけで入力OK / −×÷は先に選択 / 別セルタップで自動確定</div><div class="screen" id="screen">0</div></div>
   <div class="keys" id="keys"></div>
  </div>
 </div>
</div>
<div class="overlay" id="overlay"><div class="dialog"><b id="copyTitle">コピー先</b><div class="dest" id="dest"></div><button class="cancel" id="cancel">キャンセル</button></div></div>
<script>
(function(){
"use strict";
const N=5,ROWS=8,STORE="five_calc_keypad_v1";
let data=Array.from({length:N},()=>[]),names=Array.from({length:N},(_,i)=>"List"+(i+1)),points=Array(N).fill(0);
let active=0,target=0,pending="+",current="",copySource=null;
const $=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString("ja-JP",{maximumFractionDigits:2});
function total(i){return data[i].reduce((s,x)=>s+Number(x.effect||0),0)}
function save(){try{localStorage.setItem(STORE,JSON.stringify({data,names,points}))}catch(e){}}
function load(){try{let s=JSON.parse(localStorage.getItem(STORE)||"null");if(!s)return;if(Array.isArray(s.data)&&s.data.length===N)data=s.data;if(Array.isArray(s.names)&&s.names.length===N)names=s.names;if(Array.isArray(s.points)&&s.points.length===N)points=s.points}catch(e){}}
function effect(v,op,i){if(op==="+")return v;if(op==="-")return-v;let b=total(i);if(op==="×")return b*v-b;if(op==="÷")return v===0?NaN:b/v-b;return v}
function renderNames(){let r=$("names");r.innerHTML="";names.forEach((n,i)=>{let x=document.createElement("input");x.value=n;x.dataset.name=i;r.appendChild(x)})}
function render(){
 let root=$("cols");root.innerHTML="";
 for(let i=0;i<N;i++){
  let col=document.createElement("div");col.className="col"+(i===active?" active":"");
  let paper=document.createElement("div");paper.className="paper";
  let count=Math.max(ROWS,data[i].length+1);
  for(let r=0;r<count;r++){
   let c=document.createElement("div");c.className="cell"+(i===active&&r===target?" selected":"");c.dataset.col=i;c.dataset.row=r;
   if(r<data[i].length){let x=data[i][r];if(x.op==="-"||Number(x.effect)<0)c.classList.add("minus");c.innerHTML='<span class="op">'+x.op+'</span>'+fmt(x.value)+'<button class="del" data-del="'+i+':'+r+'">×</button>'}
   paper.appendChild(c)
  }
  col.appendChild(paper);
  let s=document.createElement("div");s.className="summary";
  s.innerHTML='<div class="row pay"><span>支払い合計</span><strong>'+fmt(total(i))+'円</strong></div><label>付与ポイント</label><input class="point" data-point="'+i+'" type="number" inputmode="numeric" min="0" step="1" value="'+(points[i]||"")+'" placeholder="0"><div class="row"><span>実質金額</span><strong>'+fmt(total(i)-(points[i]||0))+'円</strong></div>';
  col.appendChild(s);
  let t=document.createElement("div");t.className="tools";t.innerHTML='<button class="acsmall" data-ac="'+i+'">AC</button><button class="copy" data-copy="'+i+'">列コピー</button>';col.appendChild(t);root.appendChild(col)
 }
}
function updateScreen(){
 $("screen").textContent=(pending?pending+" ":"")+(current===""?"0":current);
 updateKeyState();
}
function updateKeyState(){
 document.querySelectorAll("#keys .key").forEach(function(b){
   if(b.dataset.t==="n"||b.dataset.t==="sign"||b.dataset.t==="back"||b.dataset.t==="c"){
     b.classList.remove("locked");
   }
   if(b.dataset.t==="op")b.classList.toggle("chosen",pending===b.dataset.v);
 });
}
function commitPendingSilently(){
 if(!pending || current==="") return false;
 let v=Number(current); if(!Number.isFinite(v)) return false;
 let ef=effect(v,pending,active); if(!Number.isFinite(ef)) return false;
 let pos=Math.min(target,data[active].length);
 data[active].splice(pos,0,{value:v,op:pending,effect:ef});
 target=pos+1; current=""; pending="+"; save();
 return true;
}
function chooseCell(i,r){
 // Commit the value in the previously selected cell BEFORE changing active/target.
 if(current!==""){
   commitPendingSilently();
 }
 active=i;
 target=r;
 pending="+";
 current="";
 render();
 updateScreen();
 $("expr").textContent=names[i]+" "+(r+1)+"行目：数字入力で＋ / 必要なら − × ÷ を選択";
}
function chooseOp(op){pending=op;current="";updateScreen();$("expr").textContent=names[active]+" "+(target+1)+"行目："+op+" → 数字を入力"}
function number(v){
 if(!pending) pending="+";
 if(v==="."){
   if(current.includes("."))return;
   current=current===""?"0.":current+".";
 }else{
   if(current==="0")current=v; else current+=v;
 }
 updateScreen();
 $("expr").textContent=names[active]+" "+(target+1)+"行目："+pending+" "+current;
}
function commit(){
 if(!pending){$("expr").textContent="先に四則演算を選択";return}
 if(current===""||current==="0."){$("expr").textContent="数字を入力してください";return}
 let v=Number(current);if(!Number.isFinite(v))return;let ef=effect(v,pending,active);if(!Number.isFinite(ef)){$("expr").textContent="0では割れません";return}
 let pos=Math.min(target,data[active].length);data[active].splice(pos,0,{value:v,op:pending,effect:ef});target=pos+1;current="";pending="+";save();render();updateScreen();$("expr").textContent=names[active]+" "+(pos+1)+"行目に入力完了"
}
function buildKeys(){
 let ks=[["7","n"],["8","n"],["9","n"],["÷","op"],["4","n"],["5","n"],["6","n"],["×","op"],["1","n"],["2","n"],["3","n"],["-","op"],["0","n"],[".","n"],["C","c"],["+","op"],["±","sign"],["←","back"],["=","eq"],["AC","all"]];
 ks.forEach(([v,t])=>{let b=document.createElement("button");b.type="button";b.className="key "+(t==="op"?"opkey ":"")+(t==="eq"?"eq ":"")+(t==="c"||t==="all"?"danger ":"");b.textContent=v;b.dataset.t=t;b.dataset.v=v;$("keys").appendChild(b)});updateKeyState();
}
$("keys").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;e.preventDefault();let t=b.dataset.t,v=b.dataset.v;
 if(t==="n")number(v);else if(t==="op")chooseOp(v);else if(t==="eq")commit();else if(t==="c"){current="";pending="+";updateScreen()}
 else if(t==="back"){current=current.slice(0,-1);updateScreen()}else if(t==="sign"){if(current!=="")current=String(-Number(current));updateScreen()}
 else if(t==="all"){data[active]=[];points[active]=0;target=0;pending="+";current="";save();render();updateScreen()}
});
$("cols").addEventListener("pointerdown",function(e){
 // When another calculation cell is touched, save the current number first.
 let cell=e.target.closest(".cell");
 if(cell && current!==""){
   let newCol=Number(cell.dataset.col), newRow=Number(cell.dataset.row);
   if(newCol!==active || newRow!==target){
     commitPendingSilently();
     active=newCol;
     target=newRow;
     pending="+";
     current="";
     render();
     updateScreen();
     $("expr").textContent=names[active]+" "+(target+1)+"行目：数字入力で＋";
     e.preventDefault();
   }
 }
},true);
$("cols").addEventListener("click",e=>{
 if(e.target.matches("input"))return;
 if(e.target.dataset.del){let [i,r]=e.target.dataset.del.split(":").map(Number);data[i].splice(r,1);active=i;target=Math.min(r,data[i].length);save();render();return}
 if(e.target.dataset.ac!==undefined){let i=Number(e.target.dataset.ac);data[i]=[];points[i]=0;active=i;target=0;pending="+";current="";save();render();return}
 if(e.target.dataset.copy!==undefined){copySource=Number(e.target.dataset.copy);openCopy();return}
 let c=e.target.closest(".cell");if(c)chooseCell(Number(c.dataset.col),Number(c.dataset.row))
});
/* Point field alone uses the native iPad keyboard. Never re-render while it is focused. */
$("cols").addEventListener("focusin",e=>{
 if(e.target.dataset.point!==undefined){
   commitPendingSilently();
   active=Number(e.target.dataset.point);
   render();
   setTimeout(function(){
     let inp=document.querySelector('.point[data-point="'+active+'"]');
     if(inp) inp.focus();
   },0);
 }
});
$("cols").addEventListener("input",e=>{if(e.target.dataset.point===undefined)return;let i=Number(e.target.dataset.point);points[i]=Math.max(0,Number(e.target.value)||0);save();let col=e.target.closest(".col"),vals=col.querySelectorAll(".row strong");if(vals.length>1)vals[1].textContent=fmt(total(i)-points[i])+"円"});
$("names").addEventListener("input",e=>{let i=Number(e.target.dataset.name);names[i]=e.target.value||("List"+(i+1));save()});
function openCopy(){let d=$("dest");d.innerHTML="";$("copyTitle").textContent=names[copySource]+" のコピー先";for(let i=0;i<N;i++)if(i!==copySource){let b=document.createElement("button");b.textContent=names[i];b.dataset.dest=i;d.appendChild(b)}$("overlay").classList.add("show")}
$("dest").addEventListener("click",e=>{if(e.target.dataset.dest===undefined)return;let d=Number(e.target.dataset.dest);data[d]=data[copySource].map(x=>({...x}));points[d]=points[copySource];active=d;target=data[d].length;save();render();$("overlay").classList.remove("show")});
$("cancel").onclick=()=>$("overlay").classList.remove("show");
load();renderNames();buildKeys();render();updateScreen();
})();
</script>
</body></html>
